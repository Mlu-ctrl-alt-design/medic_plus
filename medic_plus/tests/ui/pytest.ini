[pytest]
# Playwright UI tests for Medic Plus
# Run from /home/fruppa/frappe-bench:
#   env/bin/python -m pytest apps/medic_plus/medic_plus/tests/ui/ -v
#   env/bin/python -m pytest apps/medic_plus/medic_plus/tests/ui/ -v --headed
#   env/bin/python -m pytest apps/medic_plus/medic_plus/tests/ui/ -v -k "doctor"
#   env/bin/python -m pytest apps/medic_plus/medic_plus/tests/ui/ -v -k "patient"

addopts = --browser chromium --screenshot only-on-failure --output /tmp/playwright-results --tracing retain-on-failure
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
